services:
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile.novo
    container_name: jenkins
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - ./jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock  # Permite executar comandos Docker
      - /usr/bin/docker:/usr/bin/docker
    environment:
      - DOCKER_HOST=unix:///var/run/docker.sock
      - TZ=America/Recife

volumes:
  jenkins_home: