version: '3.8'

services:
  jenkins:
    build: .  # Usa o marcador build para construir a partir do Dockerfile
    container_name: jenkins
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - ./jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock  # Permite executar comandos Docker
    environment:
      - DOCKER_HOST=unix:///var/run/docker.sock
    # restart: unless-stopped

volumes:
  jenkins_home: